<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Mobail — Магазин мобильных аксессуаров и ремонта</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }
        .header {
            background: linear-gradient(135deg, #0066ff, #3399ff);
            width: 100%;
            max-width: 480px;
            padding: 25px 15px;
            text-align: center;
            color: white;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.2);
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.4;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 24px 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }
        .logo-img {
            max-width: 140px;
            max-height: 140px;
            width: auto;
            height: auto;
            object-linejoin: round;
            margin-bottom: 12px;
        }
        .brand-name {
            font-size: 32px;
            font-weight: 800;
            color: #111;
            letter-spacing: 0.5px;
        }
        .links-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-btn {
            background-color: #0066ff;
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 102, 255, 0.15);
            transition: background-color 0.2s, transform 0.1s;
        }
        .link-btn:active {
            transform: scale(0.98);
            background-color: #0052cc;
        }
        .link-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .link-subtitle {
            font-size: 13px;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Магазин мобильных аксессуаров и ремонта</h1>
        <p>Продажа аксессуаров и ремонт сотовых телефонов, планшетов, фотоаппаратов и ноутбуков</p>
    </div>

    <div class="card">
        <div class="logo-container">
            <img src="logo.png" alt="A-Mobail Logo" class="logo-img">
            <div class="brand-name">A-Mobail</div>
        </div>
    </div>

    <div class="links-container">
        <!-- Новая кнопка вызова с номером и именем -->
        <a href="tel:+79277748793" class="link-btn">
            <span class="link-title">Позвонить</span>
            <span class="link-subtitle">8-927-774-87-93 (Ярослав)</span>
        </a>

        <a href="https://vk.com/szr1988rf" class="link-btn" target="_blank">
            <span class="link-title">Группа ВК</span>
            <span class="link-subtitle">ВКонтакте</span>
        </a>

        <a href="https://t.me/" class="link-btn" target="_blank">
            <span class="link-title">Техника Apple по оптовым ценам</span>
            <span class="link-subtitle">Telegram-канал</span>
        </a>

        <a href="https://vk.com/" class="link-btn" target="_blank">
            <span class="link-title">VK</span>
            <span class="link-subtitle">ВКонтакте</span>
        </a>

        <a href="https://yandex.ru/maps" class="link-btn" target="_blank">
            <span class="link-title">Оставьте пожалуйста отзыв в Яндекс</span>
            <span class="link-subtitle">Яндекс</span>
        </a>
    </div>

</body>
</html>
