<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Mobail — Магазин мобильных аксессуаров и ремонта</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 24px 12px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }
        .logo-box {
            margin-bottom: 16px;
        }
        .logo-box img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 22px;
            background: #1e1e1e;
            padding: 8px;
            border: 1px solid #333;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
            line-height: 1.3;
        }
        .subtitle {
            font-size: 13px;
            color: #aaaaaa;
            line-height: 1.4;
            margin-bottom: 24px;
            padding: 0 5px;
        }
        .phone-box {
            background: #1e1e1e;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid #333;
        }
        .phone-box span {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }
        .phone-box a {
            font-size: 20px;
            font-weight: bold;
            color: #4cd137;
            text-decoration: none;
        }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            background-color: #242424;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #333;
            transition: background 0.2s;
        }
        .btn:active {
            background-color: #333;
        }
        .btn-primary {
            background-color: #2a5885;
            border-color: #3b73a9;
        }
        .btn-tg {
            background-color: #229ed9;
            border-color: #1b85b8;
        }
        .reviews-title {
            font-size: 15px;
            font-weight: 600;
            margin: 22px 0 10px 0;
            color: #ccc;
            text-align: left;
            padding-left: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Логотип компании -->
    <div class="logo-box">
        <img src="logo.png" alt="A-Mobail Logo" onerror="this.src='https://i.ibb.co/3s83w0q/logo-placeholder.png'">
    </div>

    <h1>Магазин мобильных аксессуаров и ремонта</h1>
    <div class="subtitle">
        Продажа аксессуаров и ремонт сотовых телефонов, планшетов, фотоаппаратов, ноутбуков
    </div>

    <!-- Телефон с быстрым вызовом -->
    <div class="phone-box">
        <span>Телефон для связи (Ярослав):</span>
        <a href="tel:+79277748793">8-927-774-87-93</a>
    </div>

    <!-- Основные ссылки -->
    <div class="links-list">
        <a href="https://vk.ru/amobail" class="btn btn-primary" target="_blank">Группа ВК</a>
        <a href="https://t.me/amobail_opt" class="btn btn-tg" target="_blank">Техника Apple по оптовым ценам</a>
        <a href="https://vk.ru/oxotnic" class="btn btn-primary" target="_blank">ВКонтакте</a>

        <div class="reviews-title">Оставьте пожалуйста отзыв:</div>
        
        <a href="https://yandex.ru/maps/org/a_mobayl/39095237664/?ll=48.460736%2C53.149041&source=wizbiz_new_text_single&z=18" class="btn" target="_blank">Яндекс Карты</a>
        <a href="https://www.google.com/maps/place/A-mobail/@53.1490239,48.4606988,17z/data=!3m1!4b1!4m6!3m5!1s0x4169acce49316433:0x8047d789f7fddf37!8m2!3d53.1490239!4d48.4606988!16s%2Fg%2F11c5bqpt_q?entry=ttu&g_ep=EgoyMDI2MTExNS4wIKXMDSoASAFQAw%3D%3D" class="btn" target="_blank">Google Карты</a>
        <a href="https://2gis.ru/syzran/firm/70000001024169545?m=48.456859%2C53.140738%2F12.8" class="btn" target="_blank">2GIS</a>
    </div>
</div>

</body>
</html>
